<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Value Monitor</title>
    <meta name="description" content="Pick the values an AI should hold, then watch each sentence of its reply honor or give them up." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Crect x='8' y='9' width='3' height='14' rx='1.5' fill='%23e5532d'/%3E%3Crect x='14.5' y='13' width='3' height='10' rx='1.5' fill='%23fff'/%3E%3Crect x='21' y='6' width='3' height='17' rx='1.5' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="top">
      <span class="brand">Value Monitor</span>
      <div class="top-right">
        <button type="button" id="model-btn" class="model"><i class="dot"></i><span id="model-label">Sim mode</span></button>
        <button type="button" id="settings-btn" class="icon-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="ask" aria-label="Your question">
        <div class="prompt-wrap">
          <div id="prompt-view" class="prompt-view" role="textbox" tabindex="0" aria-label="Prompt. Click to edit."></div>
          <textarea id="prompt" class="prompt-edit" rows="2" aria-label="Prompt" hidden></textarea>
        </div>
        <div class="ask-foot">
          <button type="button" id="shuffle" class="link">Try another example</button>
          <span id="focus-note" class="focus-note"></span>
        </div>
      </section>

      <section class="dock" aria-label="Values">
        <div id="chips" class="chips" role="group" aria-label="Values the assistant should hold, up to four"></div>
        <div class="dock-right">
          <div id="strength" class="seg" role="radiogroup" aria-label="How strongly">
            <button type="button" role="radio" data-v="gentle">Gentle</button>
            <button type="button" role="radio" data-v="firm">Firm</button>
            <button type="button" role="radio" data-v="strict">Strict</button>
          </div>
          <label class="toggle"><input type="checkbox" id="compare" checked /><span class="track"></span>Compare</label>
          <button type="button" id="run" class="run">Run</button>
        </div>
      </section>

      <section id="output" class="output" aria-live="polite"></section>
      <p id="status" class="status" role="status"></p>
    </main>

    <footer class="foot">
      Replies are written by the model, guided by the values you pick. A second model call rates each sentence. These are judgments about the text, not a view inside the model.
    </footer>

    <dialog id="settings">
      <form method="dialog">
        <h2>Settings</h2>
        <label class="field">
          <span>Gemini API key</span>
          <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key" />
          <small>Free at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. It's saved only in this browser and sent only to Google. Leave it empty for sim mode.</small>
        </label>
        <div class="field">
          <span>Model</span>
          <div class="inline">
            <select id="model"></select>
            <button type="button" id="load-models" class="btn">Find my models</button>
          </div>
          <small id="models-status"></small>
        </div>
        <details>
          <summary>Import from Constitution Lab</summary>
          <textarea id="lab-md" rows="5" placeholder="Paste the Markdown from Constitution Lab's Copy Markdown button"></textarea>
          <button type="button" id="lab-import" class="btn">Use its top four values</button>
          <small id="lab-status"></small>
        </details>
        <div class="actions">
          <button value="cancel" class="btn quiet">Cancel</button>
          <button value="save" id="save" class="btn solid">Save</button>
        </div>
      </form>
    </dialog>

    <div id="boot-error" hidden></div>
    <script>
      window.__bootErrors = []
      window.addEventListener("error", (e) => window.__bootErrors.push(e.message || "a file failed to load"), true)
      setTimeout(() => {
        if (document.body.dataset.ready) return
        const box = document.getElementById("boot-error")
        box.hidden = false
        box.textContent =
          "The app didn't start. " +
          (window.__bootErrors.length ? "Error: " + window.__bootErrors.join(" | ") + ". " : "") +
          "Try an up-to-date Chrome, Edge, Firefox or Safari."
      }, 3000)
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
